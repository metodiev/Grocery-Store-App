name: Groca CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  test-build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: groca
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d groca"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/groca
      JWT_SECRET: change_this_secret
      JWT_EXPIRES_IN: 7d
      CLIENT_URL: http://localhost:5173
      PORT: 5000
      VITE_API_URL: http://localhost:5000/api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
            client/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install backend dependencies
        run: npm ci --prefix server

      - name: Install frontend dependencies
        run: npm ci --prefix client

      - name: Prisma validate and generate
        run: |
          npx prisma validate --schema server/prisma/schema.prisma
          npx prisma generate --schema server/prisma/schema.prisma

      - name: Apply migrations
        run: npx prisma migrate deploy --schema server/prisma/schema.prisma

      - name: Seed database
        run: npm run prisma:seed --prefix server

      - name: Run backend integration tests
        run: npm run test --prefix server

      - name: Run frontend tests
        run: npm run test:run --prefix client

      - name: Build frontend
        run: npm run build --prefix client

      - name: Start backend and run smoke checks
        run: |
          npm run start --prefix server > server.log 2>&1 &
          SERVER_PID=$!
          trap "kill $SERVER_PID" EXIT

          for i in {1..30}; do
            if curl -sSf http://localhost:5000/api/health > /dev/null; then
              break
            fi
            sleep 1
          done

          curl -sSf http://localhost:5000/api/health | grep '"success":true'

          ADMIN_LOGIN=$(curl -sSf -X POST http://localhost:5000/api/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"admin@groca.com","password":"Admin123!"}')

          ADMIN_TOKEN=$(echo "$ADMIN_LOGIN" | node -e 'let s="";process.stdin.on("data",d=>s+=d);process.stdin.on("end",()=>{const j=JSON.parse(s);process.stdout.write(j.data.token);});')

          curl -sSf http://localhost:5000/api/admin/stats -H "Authorization: Bearer $ADMIN_TOKEN" | grep '"success":true'
